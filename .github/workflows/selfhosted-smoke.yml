name: Self-hosted Runner Smoke Test

# ⛔ 已退役（2026-09-21）—— 自架 runner 全部刪除，CI 全走 GitHub 託管。
#
# 背景：兔兔 2026-09-21 實測後裁定自架 runner 無效益（自架 nightly 74.8 分 vs 全託管 51.9 分，
#       慢 44%，step 級證實 100% 係單核時脈差），指示刪除。4 個註冊全部 DELETE，total_count = 0，
#       機器（win-01/.201、win-02/.202、linux-01/.211、linux-02/.212）由兔兔關機。
#
# 為何要改呢個檔：本 workflow 原本硬寫自架 label（[self-hosted, Windows, X64, build, win-0N] /
#       [self-hosted, Linux, X64, build]）→ 冇任何 runner 時會**永久排隊**，睇落似「卡住」但其實
#       只係等一部永遠唔會出現嘅機。現改為單一 guard job 跑 ubuntu-latest：派佢會即刻失敗並講明原因。
#       經 nightly #119 實測，其餘 workflow（flutter-build.yml）嘅 fallback 對「空清單 total_count=0」
#       同「有註冊但 offline」一樣處理正確，所以嗰邊唔需要改。
#
# 如需重建自架 runner（快速回復路徑）：
#   * Skill：devops/github-actions-self-hosted-runners（51 份 references）
#   * Linux：~/working/build-infra-project/scripts/provision-linux-runner.sh（idempotent，約 90 秒／部）
#   * Windows：~/working/build-infra-project/dist/rd-build-setup-v1.0.22.zip → Run-ALL-Setup.bat
#   * 原有 3 個 job 版本：git 歷史 master 5a124acc6b6d8443c0aa040f86bd6d4b06afe708 之前
#     （本地副本 ~/working/build-infra-project/archive/selfhosted-smoke.yml.retired-20260921，
#     md5 36234d387b79db32a668671dd42bb62a）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-guard:
    name: RETIRED — self-hosted runners removed 2026-09-21
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain retirement and fail fast
        run: |
          echo "::error::selfhosted-smoke.yml 已退役（2026-09-21）。"
          echo ""
          echo "自架 runner 已全部刪除（total_count = 0），所以原本硬寫嘅 self-hosted label"
          echo "（[self-hosted, Windows|Linux, X64, build]）永遠唔會有 runner 接 job。"
          echo ""
          echo "RustDesk CI 現時 100% 行 GitHub 託管 runner，唔需要再派呢個 workflow。"
          echo "如果係要重建自架 runner，見檔頭註解嘅快速回復路徑。"
          exit 1
