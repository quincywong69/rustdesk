name: Self-hosted Runner Smoke Test

# 用途：驗證兩部自架 runner 真係收到 job，並且工具鏈、shell 環境全部可用。
#   * Windows: SERVER2025-rd-win  (labels: self-hosted, Windows, X64, build)
#   * Linux  : github-runner-rd-linux (labels: self-hosted, Linux, X64, build)
#
# 安全設計（公開儲存庫）：
#   * 只可手動觸發（workflow_dispatch），冇 schedule、冇 push 觸發
#   * if: github.repository == 'quincywong69/rustdesk' → 拒絕 fork PR
#   * 只跑讀取類指令，唔會產生任何 artifact、唔會改動任何檔案
#   * 獨立於 flutter-build.yml，完全唔影響現有 build 流程（可隨時刪除此檔）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-windows:
    name: smoke (windows self-hosted)
    if: github.repository == 'quincywong69/rustdesk'
    runs-on: [self-hosted, Windows, X64, build]
    timeout-minutes: 20
    steps:
      - name: "環境資訊"
        shell: pwsh
        run: |
          Write-Host "runner  : $env:RUNNER_NAME"
          Write-Host "machine : $env:COMPUTERNAME"
          Write-Host "account : $([Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Host "os      : $([Environment]::OSVersion.VersionString)"
          $c = Get-CimInstance Win32_ComputerSystem
          Write-Host ("cpu/ram : {0} logical cores / {1} GB" -f $c.NumberOfLogicalProcessors, [math]::Round($c.TotalPhysicalMemory / 1GB, 1))

      - name: "pwsh 版本 (v1.0.4 修復驗證)"
        shell: pwsh
        run: Write-Host "pwsh = $($PSVersionTable.PSVersion) ; edition = $($PSVersionTable.PSEdition)"

      - name: "Git Bash 環境 (shell bash)"
        shell: bash
        run: |
          echo "bash      : $BASH_VERSION"
          echo "bash path : $(command -v bash)"
          echo "sed       : $(command -v sed)"
          echo "tar       : $(command -v tar)"
          echo "curl      : $(command -v curl)"
          echo "--- unzip ---"
          unzip -v | head -2

      - name: "工具鏈 (runner 服務帳號 PATH 視角)"
        shell: pwsh
        run: |
          $checks = @(
            @{ n = 'git';     c = 'git --version' },
            @{ n = 'python3'; c = 'python3 --version' },
            @{ n = 'cmake';   c = 'cmake --version' },
            @{ n = 'ninja';   c = 'ninja --version' },
            @{ n = 'nasm';    c = 'nasm -v' }
          )
          foreach ($k in $checks) {
            try {
              $out = (Invoke-Expression $k.c 2>&1 | Out-String).Trim() -split "`r?`n" | Select-Object -First 1
              Write-Host ("[OK]   {0,-8} {1}" -f $k.n, $out)
            } catch {
              Write-Host ("[FAIL] {0,-8} {1}" -f $k.n, $_.Exception.Message)
              exit 1
            }
          }

      - name: "MSVC / Windows SDK"
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>&1 | Out-String).Trim()
          if (-not $vs) { Write-Host '[FAIL] 找不到 MSVC 工具組'; exit 1 }
          Write-Host "[OK]   MSVC: $vs"
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $out = cmd /c "call `"$vcvars`" >nul 2>&1 && cl 2>&1"
          if ($out -match 'Microsoft') { Write-Host '[OK]   cl.exe 可執行' } else { Write-Host '[FAIL] cl.exe 無法執行'; exit 1 }

      - name: "vcpkg 目錄可寫 (runner 服務帳號)"
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\vcpkg')) { Write-Host '[WARN] C:\vcpkg 未存在（run-vcpkg 會自行 clone）'; exit 0 }
          try {
            $t = Join-Path 'C:\vcpkg' 'runner-write-test.tmp'
            'ok' | Set-Content -Path $t -ErrorAction Stop
            Remove-Item $t -Force
            Write-Host '[OK]   C:\vcpkg 可寫'
          } catch {
            Write-Host ("[FAIL] C:\vcpkg 不可寫：{0}" -f $_.Exception.Message)
            exit 1
          }

  smoke-linux:
    name: smoke (linux self-hosted)
    if: github.repository == 'quincywong69/rustdesk'
    runs-on: [self-hosted, Linux, X64, build]
    timeout-minutes: 20
    steps:
      - name: "環境資訊"
        run: |
          echo "runner  : $RUNNER_NAME"
          echo "machine : $(hostname)"
          echo "account : $(whoami)"
          . /etc/os-release; echo "os      : $PRETTY_NAME"
          echo "kernel  : $(uname -r)"
          echo "cpu     : $(nproc) cores"
          free -h | sed -n 1,2p
          df -h / | tail -1

      - name: "工具鏈"
        run: |
          fail=0
          for c in git curl wget tar unzip jq python3 gcc make cmake ninja nasm pkg-config; do
            p=$(command -v "$c" || true)
            if [ -n "$p" ]; then printf "[OK]   %-10s %s\n" "$c" "$p"; else printf "[----] %-10s MISSING\n" "$c"; fi
          done

      - name: "出網 + sudo 能力（build 步驟需要）"
        run: |
          curl -s -o /dev/null -w "[OK]   api.github.com %{http_code}\n" --max-time 15 https://api.github.com
          sudo -n true 2>/dev/null && echo "[OK]   sudo NOPASSWD" || echo "[WARN] sudo 需要密碼（build 步驟嘅 apt-get install 可能會失敗）"

      - name: "host 依賴：sudo /opt/artifacts / swap（模擬 linux build job 前置步驟）"
        run: |
          echo "--- 模擬 'Maximize build space' 步驟 ---"
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm qemu-user-static
          echo "[OK] sudo apt-get 可用"
          echo "--- /opt/artifacts（run-vcpkg 用）---"
          if [ -w /opt/artifacts ]; then echo "[OK] /opt/artifacts 可寫（帳號 $USER）"; else echo "[FAIL] /opt/artifacts 不可寫"; exit 1; fi
          echo "--- 資源 ---"
          df -h / | tail -1
          free -m | head -2

      - name: "docker + binfmt（run-on-arch 容器建置必要）"
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}' 2>&1 | head -1
          if docker run --rm hello-world >/dev/null 2>&1; then echo "[OK] docker run 成功"; else echo "[FAIL] docker run 失敗"; exit 1; fi
          echo "--- binfmt handlers ---"
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -i qemu || echo "[WARN] 未見 qemu binfmt（qemu-user-static 剛裝，可能需 reboot 才註冊）"

      - name: "總結"
        run: echo "自架 Linux runner 可用。"
