name: T - runner probe with secret (temporary)

# ⛔ 臨時驗證檔（驗完即刪）。目的：確認 RUNNER_PROBE_PAT 真係傳到 workflow，
# 同 flutter-build.yml 內 decide-runners 嘅探測邏輯一模一樣。
on:
  workflow_dispatch:

jobs:
  probe:
    name: probe with secret
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          PROBE_PAT: ${{ secrets.RUNNER_PROBE_PAT }}
        run: |
          set -uo pipefail
          echo "secret length = ${#PROBE_PAT}"
          if [ -z "${PROBE_PAT:-}" ]; then
            echo "::warning::RUNNER_PROBE_PAT 未設定"
            exit 0
          fi
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${PROBE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")" || code="000"
          echo "GitHub runners API HTTP ${code}"
          if [ "${code}" = "200" ]; then
            jq -r '.runners[] | "  \(.name)\t\(.status)\t\([.labels[].name] | join(","))"' "$body" || true
            win_online="$(jq '[.runners[] | select(.status == "online") | select(([.labels[].name] | map(ascii_downcase)) | index("windows"))] | length' "$body" 2>/dev/null)"
            linux_online="$(jq '[.runners[] | select(.status == "online") | select(([.labels[].name] | map(ascii_downcase)) | index("linux"))] | length' "$body" 2>/dev/null)"
            echo "online windows runners = ${win_online:-unknown}, online linux runners = ${linux_online:-unknown}"
            if [ "${win_online:-0}" = "0" ]; then echo "DECISION windows_x64 = \"windows-2022\""; else echo 'DECISION windows_x64 = ["self-hosted","Windows","X64","build"]'; fi
            if [ "${linux_online:-0}" = "0" ]; then echo 'DECISION linux_x64 = "ubuntu-22.04"'; else echo 'DECISION linux_x64 = ["self-hosted","linux","x64","build"]'; fi
          else
            head -c 300 "$body" || true
            echo "DECISION would fall back to hosted (API failed)"
          fi
