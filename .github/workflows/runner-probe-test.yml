name: Probe - can GITHUB_TOKEN list self-hosted runners

# 臨時診斷用（可隨時刪）。目的：確認 workflow 內建 GITHUB_TOKEN 能否讀取
# /repos/{owner}/{repo}/actions/runners —— 若可以，runner fallback（方案 A）就唔需要 PAT secret。
on:
  workflow_dispatch:

jobs:
  probe:
    name: probe runners endpoint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Call the runners endpoint with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100"
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "${url}") || code="curl-failed"
          echo "HTTP_CODE=${code}"
          echo "--- body (first 800 chars) ---"
          head -c 800 /tmp/body.json || true
          echo
          if [ "${code}" = "200" ]; then
            echo "--- parsed ---"
            jq -r '"total_count = \(.total_count)", (.runners[] | "  \(.name) \(.status) busy=\(.busy) labels=\([.labels[].name] | join(","))")' /tmp/body.json
          fi
      - name: Report result
        if: always()
        run: echo "probe finished"
