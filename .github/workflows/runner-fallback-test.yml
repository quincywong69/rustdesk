name: Runner fallback self-test (temporary)

# ⛔ 臨時驗證用檔案（驗完即刪）。目的：證明方案 A 嘅機制可行 ——
#   ① decide job 能查 runner 狀態並輸出 windows_x64 / linux_x64
#   ② 下游 job 用 fromJSON(needs.*.outputs.*) 做 runs-on 能真正落到對應 runner
#   ③ simulate-offline=true 時（假裝全部 offline）會轉去 GitHub 托管
# 同 flutter-build.yml 內嘅 decide-runners 邏輯一致（改嘅時候兩邊要同步，驗完就刪）。
on:
  workflow_dispatch:
    inputs:
      simulate-offline:
        description: "假裝自架 runner 全部 offline，驗證 fallback 去 hosted"
        type: boolean
        default: false

jobs:
  decide-runners:
    name: decide runners
    runs-on: ubuntu-latest
    outputs:
      windows_x64: ${{ steps.probe.outputs.windows_x64 }}
      linux_x64: ${{ steps.probe.outputs.linux_x64 }}
    steps:
      - name: Probe self-hosted runner availability
        id: probe
        env:
          PROBE_PAT: ${{ secrets.RUNNER_PROBE_PAT }}
          SIMULATE_OFFLINE: ${{ inputs.simulate-offline }}
        run: |
          set -uo pipefail
          SELF_WIN='["self-hosted","Windows","X64","build"]'
          SELF_LINUX='["self-hosted","linux","x64","build"]'
          HOSTED_WIN='"windows-2022"'
          HOSTED_LINUX='"ubuntu-22.04"'

          win="$SELF_WIN"
          linux="$SELF_LINUX"

          if [ "${SIMULATE_OFFLINE}" = "true" ]; then
            echo "=== SIMULATE_OFFLINE: 假裝 runners 全部 offline ==="
            win="$HOSTED_WIN"
            linux="$HOSTED_LINUX"
          elif [ -z "${PROBE_PAT:-}" ]; then
            echo "::warning::RUNNER_PROBE_PAT 未設定 → runner fallback 停用，繼續使用自架 runner。"
          else
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer ${PROBE_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")" || code="000"
            echo "GitHub runners API HTTP ${code}"
            if [ "${code}" = "200" ]; then
              jq -r '.runners[] | "  \(.name)\t\(.status)\t\([.labels[].name] | join(","))"' "$body" || true
              win_online="$(jq '[.runners[] | select(.status == "online") | select(([.labels[].name] | map(ascii_downcase)) | index("windows"))] | length' "$body" 2>/dev/null)" || win_online=""
              linux_online="$(jq '[.runners[] | select(.status == "online") | select(([.labels[].name] | map(ascii_downcase)) | index("linux"))] | length' "$body" 2>/dev/null)" || linux_online=""
              echo "online windows runners = ${win_online:-unknown}, online linux runners = ${linux_online:-unknown}"
              if [ "${win_online:-0}" = "0" ]; then
                win="$HOSTED_WIN"
                echo "::warning::冇 Windows 自架 runner online → windows x64 job 改用 windows-2022。"
              fi
              if [ "${linux_online:-0}" = "0" ]; then
                linux="$HOSTED_LINUX"
                echo "::warning::冇 Linux 自架 runner online → linux x64 job 改用 ubuntu-22.04。"
              fi
            else
              win="$HOSTED_WIN"
              linux="$HOSTED_LINUX"
              echo "::warning::查詢 runner 狀態失敗（HTTP ${code}）→ 保守改用 GitHub 托管 runner。"
            fi
          fi

          {
            echo "windows_x64=$win"
            echo "linux_x64=$linux"
          } >> "$GITHUB_OUTPUT"
          echo "DECISION windows_x64=$win"
          echo "DECISION linux_x64=$linux"

  consumer-windows:
    name: consumer windows (${{ needs.decide-runners.outputs.windows_x64 }})
    needs: [decide-runners]
    runs-on: ${{ fromJSON(needs.decide-runners.outputs.windows_x64) }}
    steps:
      - name: Report where this landed
        run: |
          echo "runner.name        = ${{ runner.name }}"
          echo "runner.os          = ${{ runner.os }}"
          echo "runner.arch        = ${{ runner.arch }}"
          echo "runner.environment = ${{ runner.environment }}"

  consumer-linux:
    name: consumer linux (${{ needs.decide-runners.outputs.linux_x64 }})
    needs: [decide-runners]
    runs-on: ${{ fromJSON(needs.decide-runners.outputs.linux_x64) }}
    steps:
      - name: Report where this landed
        run: |
          echo "runner.name        = ${{ runner.name }}"
          echo "runner.os          = ${{ runner.os }}"
          echo "runner.arch        = ${{ runner.arch }}"
          echo "runner.environment = ${{ runner.environment }}"
