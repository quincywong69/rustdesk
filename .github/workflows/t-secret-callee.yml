name: T - secret inheritance callee (temporary)

# ⛔ 臨時驗證用（驗完即刪）。
# 目的：確認喺 on.workflow_call.secrets 只聲明 RUNNER_PROBE_PAT 嘅情況下，
# 用 secrets: inherit 嘅 caller 會唔會令「未聲明」嘅 secret（RENDEZVOUS_SERVER 等）
# 喺 callee 內變成空值。呢個決定 decide-runners 要唔要聲明該 secret。
on:
  workflow_call:
    secrets:
      RUNNER_PROBE_PAT:
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret availability (lengths only)
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RUNNER_PROBE_PAT: ${{ secrets.RUNNER_PROBE_PAT }}
        run: |
          echo "declared     RUNNER_PROBE_PAT length = ${#RUNNER_PROBE_PAT}"
          echo "undeclared   RENDEZVOUS_SERVER length = ${#RENDEZVOUS_SERVER}"
          echo "undeclared   RS_PUB_KEY length = ${#RS_PUB_KEY}"
          if [ -n "${RENDEZVOUS_SERVER}" ]; then
            echo "RESULT: undeclared secrets ARE inherited -> declaration is safe"
          else
            echo "RESULT: undeclared secrets are NOT inherited -> must remove the declaration"
          fi
